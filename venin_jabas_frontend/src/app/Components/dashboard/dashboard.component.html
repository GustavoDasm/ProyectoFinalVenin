<div class="container content-area relative">
    <div class="page-header">
        <h4 class="page-title">Dashboard</h4>
        
    </div>
    <div class="card mx-auto" style="width: fit-content;">
        <div class="card-body px-0">
            
            <h5 class="pl-5">Ventas diarias por mes</h5>
            <div class="row p-0">
                <div class="col-10 ml-5">
                    <div class="d-flex flex-wrap align-items-center gap-3">
                        <div class="form-group mb-0">
                            <label class="mr-2">Mes</label>
                            <select class="form-control" [(ngModel)]="selectedMonth" (change)="GetVentasDiarias()">
                                <option *ngFor="let mes of meses" [value]="mes.valor">{{ mes.nombre }}</option>
                            </select>
                        </div>
                        <div class="form-group mb-0">
                            <label class="mr-2">Producto</label>
                            <select class="form-control" [(ngModel)]="productSelected" (change)="GetVentasDiarias()">
                                <option *ngFor="let art of articulos" [value]="art.idproduct">{{ art.nombre }}</option>
                            </select>
                        </div>
                    </div>
                </div>
    
                <div class="col-10 mt-5 mx-auto">
                    <div class="chart-container">
                        <canvas id="ventasChart" height="250" width="300" ></canvas>
                    </div>
                </div>
            </div>
            <hr>
            <h5 class="pl-5">Ventas diarias por mes | Cuadro de datos</h5>
            <div class="row p-0 px-4">
                <div class="col-10 mt-5 mx-5">
                    <table class="">
                        <thead> 
                            <tr>
                                
                                <th class="text-nowrap" *ngFor="let dia of DaysList.slice(0, 15);let i = index">Dia {{i+1}}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                
                                <td *ngFor="let sales of SalesByDay.slice(0, 15)">{{sales | number:'1.2'}}</td>
                            </tr>
                        </tbody>
                    </table>
                    <table class="mt-3">
                        <thead> 
                            <tr>
                                
                                <th class="text-nowrap"  *ngFor="let dia of DaysList.slice(15);let i = index">Dia {{i+16}}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                
                                <td *ngFor="let sales of SalesByDay.slice(15)">{{sales | number:'1.2'}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>
        <div class="card-footer">
            <div class="text-center">
                <!-- <button class="btn btn-primary" (click)="imprimirGrafico()">Imprimir Gráfico</button> -->
            </div>
        </div>
    </div>
    
    

</div>
