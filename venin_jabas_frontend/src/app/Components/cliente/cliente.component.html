<div class=" content-area relative ml-2 mr-2">
    <div class="page-header m-1">

        <h4 class="page-title ">Cliente</h4>
        <!-- <div class="user-info ml-auto text-white">Vendedor: <span class=''>{{usuario.username}}</span>
        </div> -->
    </div>
    <div class="container-fluid">
        <mat-card>
            <mat-card-content>
                <div fxLayout="row wrap" fxLayoutAlign="start center" fxLayoutGap="8px" class="filter-container">
                    <!-- Filtros -->
                    <mat-form-field appearance="outline" fxFlex="300px">
                        <mat-label>Buscar por Nombres</mat-label>
                        <input matInput [(ngModel)]="filtro.nombre" (ngModelChange)="applyFilter()"
                            placeholder="Escribe aquí..." />
                        <button mat-icon-button matSuffix *ngIf="filtro.nombre" (click)="clearFilter()"
                            aria-label="Limpiar filtro">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>

                    <!-- Botones de acción -->
                    <div fxLayout="row wrap" fxLayoutAlign="space-between center" fxFlex class="button-group mb-4">
                        <button mat-raised-button color="primary" (click)="addCliente()">
                            Agregar Cliente
                        </button>
                    </div>
                </div>
                <hr style="width: 100%; margin: 8px 0; border: none; border-top: 1px  #ccc;">
                <div class="table-container mat-elevation-z1">
                    <table mat-table [dataSource]="dataSource" matSort class="w-100">

                        <!-- Cliente -->
                        <ng-container matColumnDef="apellidos">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Apellidos</th>
                            <td mat-cell *matCellDef="let element" class="text-uppercase col-acciones">{{
                                element.apellidos }}</td>
                        </ng-container>

                        <!-- Celular -->
                        <ng-container matColumnDef="celular">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Celular</th>
                            <td mat-cell *matCellDef="let element">{{ element.celular }}</td>
                        </ng-container>

                        <!-- Tipo de documento -->
                        <ng-container matColumnDef="tipodoc">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo Documento</th>
                            <td mat-cell *matCellDef="let element">{{ getTipoDocumentoTexto(element.tipodoc) }}</td>
                        </ng-container>

                        <!-- Numero -->
                        <ng-container matColumnDef="numero">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Numero</th>
                            <td mat-cell *matCellDef="let element">{{ element.numero }}</td>
                        </ng-container>

                        <!-- Acciones -->
                        <ng-container matColumnDef="acciones">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Acciones</th>
                            <td mat-cell *matCellDef="let element">
                                <button mat-icon-button color="primary" (click)="editarOperacion(element.idcliente)">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-icon-button color="warn" aria-label="Anular" matTooltip="Anular"
                                    (click)="anularOperacion(element.idcliente)">
                                    <mat-icon>cancel</mat-icon>
                                </button>
                            </td>
                        </ng-container>
                        <!-- Header y Filas -->
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                    <mat-paginator [pageSizeOptions]="[5, 10, 20, 100]" showFirstLastButtons></mat-paginator>
                </div>
            </mat-card-content>

        </mat-card>

    </div>
    <!-- ROW-1 CLOSED -->

</div>
