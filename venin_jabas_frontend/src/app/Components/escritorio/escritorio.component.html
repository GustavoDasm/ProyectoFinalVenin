<div class=" content-area relative ml-2 mr-2">
    <div class="page-header m-1">

        <!-- <h4 class="page-title ">Guia Salida</h4> -->
        <!-- <div class="user-info ml-auto text-white">Vendedor: <span class=''>{{usuario.username}}</span>
        </div> -->
    </div>
    <div class="container-fluid">
        <div class="card escritorio-container">
            <h1 class="titulo">Escritorio</h1>

            <div class="grid-buttons">
                <button class="card custom-card" (click)="openLink('guia-salida')" aria-label="Guias">
                    <div class="card-icon" aria-hidden="true">
                        <!-- icono genérico guía -->
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 7h18M3 12h18M3 17h18" stroke="#333" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M7 3v18" stroke="#333" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="card-text">Guias</div>
                </button>

                <button class="card custom-card" (click)="openLink('ajustes')" aria-label="Ingresos Javas">
                    <div class="card-icon" aria-hidden="true">
                        <!-- icono caja / java -->
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="6" width="18" height="12" rx="2" stroke="#333" stroke-width="1.6" />
                            <path d="M7 6v-2h10v2" stroke="#333" stroke-width="1.6" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="card-text">Ingresos Javas</div>
                </button>

                <button class="card custom-card" (click)="reporteCuentaCliente()" aria-label="Deudas de clientes">
                    <div class="card-icon" aria-hidden="true">
                        <!-- icono cartera / deudas -->
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 7h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="#333" stroke-width="1.6"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M16 3v4" stroke="#333" stroke-width="1.6" stroke-linecap="round" />
                            <circle cx="8.5" cy="12.5" r="1.5" stroke="#333" stroke-width="1.6" />
                        </svg>
                    </div>
                    <div class="card-text">Deudas de clientes</div>
                </button>

                <button class="card custom-card" (click)="showmodal_kardex()"
                    aria-label="Inventario de productos">
                    <div class="card-icon" aria-hidden="true">
                        <!-- icono inventario / caja apilada -->
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2l8 4-8 4-8-4 8-4z" stroke="#333" stroke-width="1.4" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M4 10l8 4 8-4" stroke="#333" stroke-width="1.4" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M4 16l8 4 8-4" stroke="#333" stroke-width="1.4" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="card-text">Inventario de productos</div>
                </button>

                <button class="card custom-card" (click)="reportePlanillas()" aria-label="Reporte Planillas">
                    <div class="card-icon" aria-hidden="true">
                        <!-- icono reporte -->
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 7h8M8 11h8M8 15h5" stroke="#333" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <rect x="3" y="3" width="18" height="18" rx="2" stroke="#333" stroke-width="1.2" />
                        </svg>
                    </div>
                    <div class="card-text">Reporte Planillas</div>
                </button>
            </div>
        </div>
    </div>
</div>
<app-kardex></app-kardex>
