<h1 mat-dialog-title>
    Nueva Venta
</h1>

<div mat-dialog-content>
    <ng-template #loadingSpinner aria-hidden="true">
        <div class="spinner-container">
            <mat-progress-spinner mode="indeterminate" diameter="48">
            </mat-progress-spinner>
        </div>
    </ng-template>

    <form [formGroup]="addVentaForm">
        <div class="info-grid">

            <!-- Fila 1:  -->
            <div class="row-1">
                <div class="info-item">
                    <mat-label>Producto</mat-label>
                    <ng-select [items]="articulos" bindLabel="nombreArticulo" 
                        [loading]="loadingArticulos" [typeToSearchText]="'Escribe para buscar...'"
                        (search)="onSearchArticulos($event.term)" (change)="onArticuloSelected($event)" 
                        [clearable]="false">>
                    </ng-select>
                </div>
            </div>

            <!-- Fila 2 -->
            <div class="row-2">      
                <div class="info-item">
                <mat-form-field appearance="outline" floatLabel="always">
                    <mat-label>Cantidad</mat-label>
                    <input matInput formControlName="cantidad" type="number" required>
                </mat-form-field> 
                </div>        
                <div class="info-item ">
                <mat-form-field appearance="outline" floatLabel="always">
                    <mat-label>Precio</mat-label>
                    <input matInput formControlName="precio" type="number" required>
                </mat-form-field> 
                </div>                                    
            </div>
            
            <!-- Fila 3 -->
            <div class="row-3">
                <div class="info-item">
                <mat-form-field appearance="outline" floatLabel="always">
                    <mat-label>Total</mat-label>
                    <input matInput formControlName="total" type="number" required>
                </mat-form-field> 
                </div>                        
            </div>
        </div>
    </form>
</div>



<div mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="addVentaForm.invalid">
        <mat-icon>save</mat-icon> {{ dataForm ? 'Actualizar' : 'Guardar' }}
    </button>
</div>
