<div class="content-area relative ml-2 mr-2">
    <div class="page-header m-1">
        <h4 class="page-title">Transportistas</h4>
    </div>

    <div class="container-fluid">
        <mat-card>
            <mat-card-content>
                <div fxLayout="row wrap" fxLayoutAlign="start center" fxLayoutGap="8px" class="filter-container">
                    <!-- Filtro por texto (nombre / celular) -->
                    <mat-form-field appearance="outline" fxFlex="300px">
                        <mat-label>Buscar (apellidos / celular)</mat-label>
                        <input matInput [(ngModel)]="filtro.texto" (ngModelChange)="applyFilter()"
                            placeholder="Escribe aquí..." />
                        <button mat-icon-button matSuffix *ngIf="filtro.texto" (click)="clearFilter()"
                            aria-label="Limpiar filtro">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>


                    <div fxLayout="row wrap" fxLayoutAlign="space-between center" fxFlex class="button-group mb-4">
                        <button mat-raised-button color="primary" (click)="addTransportista()">
                            Agregar Transportista
                        </button>
                    </div>
                </div>

                <hr style="width:100%;margin:8px 0;border:none;border-top:1px #ccc;">

                <div class="table-container mat-elevation-z1">
                    <table mat-table [dataSource]="dataSource" matSort class="w-100">

                        <!-- Apellidos -->
                        <ng-container matColumnDef="apellidos">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Apellidos</th>
                            <td mat-cell *matCellDef="let element" class="text-uppercase">{{ element.apellidos }}</td>
                        </ng-container>

                        <!-- Celular -->
                        <ng-container matColumnDef="celular">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Celular</th>
                            <td mat-cell *matCellDef="let element">{{ element.celular }}</td>
                        </ng-container>

                        <!-- Acciones -->
                        <ng-container matColumnDef="acciones">
                            <th mat-header-cell *matHeaderCellDef>Acciones</th>
                            <td mat-cell *matCellDef="let element">
                                <button mat-icon-button color="primary" (click)="editarTransportista(element.idtrans)"
                                    matTooltip="Editar">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-icon-button color="warn" (click)="eliminarTransportista(element.idtrans)"
                                    matTooltip="Eliminar">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <!-- Header y Filas -->
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>

                    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
