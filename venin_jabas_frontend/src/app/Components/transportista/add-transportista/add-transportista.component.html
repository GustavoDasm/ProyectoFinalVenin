<h2 mat-dialog-title>{{ titulo }}</h2>

<mat-dialog-content class="dialog-content">
    <div *ngIf="loading" class="loading-overlay">
        <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
    </div>

    <!-- IMPORTANTE: bind al formGroup aquí -->
    <form [formGroup]="form">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Apellidos</mat-label>
            <input matInput formControlName="apellidos" autocomplete="off" />
            <mat-error *ngIf="apellidos?.hasError('required')">Apellidos es requerido</mat-error>
            <mat-error *ngIf="apellidos?.hasError('maxlength')">Máx 50 caracteres</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Celular</mat-label>
            <input matInput formControlName="celular" autocomplete="off" />
            <mat-hint>Opcional</mat-hint>
            <mat-error *ngIf="celular?.hasError('maxlength')">Máx 15 caracteres</mat-error>
        </mat-form-field>
    </form>
</mat-dialog-content>


<mat-dialog-actions align="end">
    <button mat-button (click)="cancelar()" [disabled]="loading">Cancelar</button>
    <button mat-raised-button color="primary" (click)="guardar()" [disabled]="loading">
        {{ isEdit ? 'Guardar cambios' : 'Crear' }}
    </button>
</mat-dialog-actions>
